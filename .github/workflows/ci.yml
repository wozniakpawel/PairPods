name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Build on macOS ${{ matrix.macos }} for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "15 (Sequoia)"
            runner: macos-15
            xcode: "16.0"
            arch: "Universal"
          - macos: "Latest"
            runner: macos-latest
            xcode: "latest-stable"
            arch: "Universal"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ matrix.xcode }}
      
      - name: Cache Swift packages
        uses: actions/cache@v4.2.1
        with:
          path: .build
          key: ${{ runner.os }}-${{ matrix.runner }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runner }}-spm-
      
      - name: Verify SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project PairPods.xcodeproj
          
      - name: Build
        # Warnings are errors in CI only. Locally they stay warnings so a work in
        # progress still compiles.
        run: |
          xcodebuild clean build -scheme PairPods -configuration Debug -derivedDataPath ./DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO PAIRPODS_WARNINGS_AS_ERRORS=YES
      
      - name: Install BlackHole and wait for CoreAudio to publish it
        run: ./scripts/ci/ensure-blackhole.sh

      - name: Run Tests
        env:
          PAIRPODS_REQUIRE_BLACKHOLE: "1"
        run: |
          xcodebuild test -scheme PairPods -configuration Debug -derivedDataPath ./DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES -destination 'platform=macOS' -enableCodeCoverage YES

      # A ratchet, not an aspiration: the threshold sits just under the current figure so
      # it fails on a real regression without demanding a coverage push. Raise it when
      # coverage genuinely improves.
      - name: Coverage gate
        run: |
          THRESHOLD=42
          xcrun xccov view --report --only-targets ./DerivedData/Logs/Test/*.xcresult
          pct=$(xcrun xccov view --report --only-targets ./DerivedData/Logs/Test/*.xcresult \
                | awk '/PairPods\.app/ {gsub(/%/,"",$4); print int($4)}')
          echo "PairPods.app line coverage: ${pct:-unknown}% (threshold ${THRESHOLD}%)"
          if [ -z "$pct" ]; then
            echo "::error::Could not read coverage for PairPods.app"
            exit 1
          fi
          if [ "$pct" -lt "$THRESHOLD" ]; then
            echo "::error::Coverage ${pct}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Verify app architectures
        run: |
          lipo -info ./DerivedData/Build/Products/Debug/PairPods.app/Contents/MacOS/PairPods
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: PairPods-${{ matrix.macos }}-${{ matrix.arch }}-Debug
          path: |
            ./DerivedData/Build/Products/Debug/PairPods.app
          retention-days: 7